<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budżet Zlecenia</title>
  </head>
  <body>
    <div class="app-container">
      
      <!-- ========================================== -->
      <!-- WIDOK 1: PANEL GŁÓWNY (LISTA ZLECEŃ)       -->
      <!-- ========================================== -->
      <div id="dashboard-view">
        <header class="client-header">
          <div class="client-title">
            <h1>Moje zlecenia</h1>
          </div>
        </header>

        <!-- Formularz dodawania nowego klienta -->
        <section class="card form-section" style="margin-bottom: 24px;">
          <h2>Nowe zlecenie</h2>
          <form id="new-project-form">
            <div class="form-group">
              <label for="project-name">Nazwa klienta / projektu</label>
              <input type="text" id="project-name" placeholder="np. Nowak - Szafa wnękowa" required>
            </div>
            <div class="summary-grid">
              <div class="form-group">
                <label for="project-total">Całkowita wartość (zł)</label>
                <input type="number" id="project-total" step="0.01" required>
              </div>
              <div class="form-group">
                <label for="project-deposit">Pobrana zaliczka (zł)</label>
                <input type="number" id="project-deposit" step="0.01" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Utwórz zlecenie</button>
          </form>
        </section>

        <!-- Kafelki z istniejącymi zleceniami -->
        <section>
          <h2>Aktywne projekty</h2>
          <div class="projects-grid" id="projects-list-container">
            <!-- Tutaj JavaScript będzie ładował zlecenia z Firebase -->
            <p>Ładowanie zleceń...</p>
          </div>
        </section>
      </div>

      <!-- ========================================== -->
      <!-- WIDOK 2: SZCZEGÓŁY ZLECENIA (STARY KOD)    -->
      <!-- ========================================== -->
      <div id="project-details-view" class="hidden">
        <header class="client-header">
          <button class="btn-back" id="btn-back-to-dashboard">← Wróć do listy</button>
          <div class="client-title">
            <h1 id="details-client-name">Jan Kowalski - Zabudowa kuchni</h1>
            <span class="badge active">W trakcie</span>
          </div>
        </header>

        <section class="summary-grid">
          <div class="card summary-card">
            <h3>Wartość zlecenia</h3>
            <p class="amount" id="total-price">0 zł</p>
          </div>
          <div class="card summary-card">
            <h3>Wpłacona zaliczka</h3>
            <p class="amount text-blue" id="deposit">0 zł</p>
          </div>
          <div class="card summary-card">
            <h3>Suma wydatków</h3>
            <p class="amount text-red" id="total-expenses">0 zł</p>
          </div>
          <div class="card summary-card highlight">
            <h3>Pozostało z zaliczki</h3>
            <p class="amount" id="current-balance">0 zł</p>
          </div>
        </section>

        <div class="main-content">
          <section class="card form-section">
            <h2>Dodaj wydatek</h2>
            <form id="expense-form">
              <div class="form-group">
                <label for="expense-name">Na co wydano?</label>
                <input type="text" id="expense-name" placeholder="np. Fronty, dna, zawiasy" required>
              </div>
              <div class="form-group">
                <label for="expense-cost">Kwota brutto (zł)</label>
                <input type="number" id="expense-cost" step="0.01" placeholder="0.00" required>
              </div>
              <button type="submit" class="btn btn-primary">Dodaj do kosztów</button>
            </form>
          </section>

          <section class="card list-section">
            <h2>Historia kosztów</h2>
            <ul class="expense-list" id="expense-list-container">
              <!-- JS ładuje tu koszty -->
            </ul>
          </section>
        </div>
      </div>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
